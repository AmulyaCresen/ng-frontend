<!-- Page background -->
<div class="page-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="login-wrapper">


    <div class="brand-section">
      <div class="logo-wrap">
        <img src="assets/logo.png" alt="Company Logo" class="logo-img" />
      </div>
      <h1 class="brand-name">Leave Management System</h1>
      <p class="brand-tagline">Streamline employee leave requests, approvals, and reporting — all in one place.</p>
    </div>

    
    <div class="login-card">
      <div class="card-top">
        <h2>Welcome Back</h2>
        <p>Sign in to your account to continue</p>
      </div>

      <form (ngSubmit)="login()" autocomplete="on" novalidate>

        
        <div class="field-wrap" [class.active]="emailFocused || email">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email"
                 id="email"
                 placeholder=" "
                 [(ngModel)]="email"
                 name="email"
                 required
                 autocomplete="email"
                 (focus)="emailFocused = true"
                 (blur)="emailFocused = false"
                 (input)="clearError()" />
          <label for="email">Email Address</label>
        </div>

       
        <div class="field-wrap" [class.active]="passwordFocused || password">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input [type]="showPassword ? 'text' : 'password'"
                 id="password"
                 placeholder=" "
                 [(ngModel)]="password"
                 name="password"
                 required
                 autocomplete="current-password"
                 (focus)="passwordFocused = true"
                 (blur)="passwordFocused = false"
                 (input)="clearError()" />
          <label for="password">Password</label>
          <button type="button" class="eye-btn" (click)="togglePassword()" tabindex="-1" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <div class="error-box" *ngIf="errorMessage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <button type="submit" class="sign-in-btn" [disabled]="loading">
          <span *ngIf="!loading">Sign In</span>
          <span *ngIf="loading" class="spinner-wrap">
            <svg class="spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
              <path d="M12 2a10 10 0 0 1 10 10" stroke="white" stroke-width="3" stroke-linecap="round"/>
            </svg>
            Signing in...
          </span>
        </button>

      </form>

      <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
    </div>

  </div>
</div>
