<div class="container">

  <!-- LEFT SIDE -->
  <div class="left">
    <div class="branding">
      <h1>Leave Management System</h1>
      <p>
        Streamline employee leave requests, approvals, and reporting —
        all in one place.
      </p>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right">
    <div class="login-card">

      <h2>Welcome Back</h2>
      <p class="subtext">Please login to continue</p>

      <form (ngSubmit)="login()">

        <!-- EMAIL -->
        <div class="input-group">
          <input type="email"
                 required
                 [(ngModel)]="email"
                 name="email"
                 (input)="clearError()" />
          <label>Email</label>
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
          <input type="password"
                 required
                 [(ngModel)]="password"
                 name="password"
                 (input)="clearError()" />
          <label>Password</label>
        </div>

        <!-- ROLE -->
        <div class="input-group">
          <select [(ngModel)]="role"
                  name="role"
                  required
                  (change)="clearError()">
            <option value="" disabled selected></option>
            <option value="ADMIN">Admin</option>
            <option value="MANAGER">Manager</option>
            <option value="EMPLOYEE">Employee</option>
          </select>
          <label>Role</label>
        </div>

        <!-- ✅ ERROR (MOVED HERE) -->
        <div class="error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button type="submit">Sign In</button>

      </form>

      <a routerLink="/forgot-password" class="forgot">
        Forgot password?
      </a>

    </div>
  </div>

</div>
